<div id="mta-countdown" role="timer" aria-live="off" aria-label="Masa promosi yang tinggal" style="box-sizing:border-box;width:100%;margin:0;padding:18px 12px 22px;background:#791512;color:#ffffff;text-align:center;font-family:Arial,Helvetica,sans-serif;">
  <div style="margin:0 0 8px;font-size:clamp(14px,3.5vw,20px);font-weight:700;letter-spacing:1.5px;line-height:1.2;">PROMOSI TAMAT DALAM</div>
  <div id="mta-countdown-value" style="margin:0;color:#ffd43b;font-size:clamp(38px,10vw,68px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1;white-space:nowrap;">03 : 30 : 24</div>
  <div style="display:flex;justify-content:center;gap:clamp(31px,11vw,82px);margin:8px 0 0;color:#ffffff;font-size:clamp(10px,2.8vw,14px);font-weight:700;letter-spacing:1px;line-height:1;">
    <span>JAM</span><span>MINIT</span><span>SAAT</span>
  </div>
</div>
<script>
(function () {
  var duration = 12624 * 1000;
  var storageKey = 'mta-countdown-end-v1';
  var output = document.getElementById('mta-countdown-value');
  if (!output) return;

  var now = Date.now();
  var end = 0;
  try { end = parseInt(localStorage.getItem(storageKey), 10) || 0; } catch (error) {}

  if (!end) {
    end = now + duration;
  } else if (end <= now) {
    end += (Math.floor((now - end) / duration) + 1) * duration;
  }

  try { localStorage.setItem(storageKey, String(end)); } catch (error) {}

  function pad(value) {
    return String(value).padStart(2, '0');
  }

  function updateCountdown() {
    var remaining = end - Date.now();
    if (remaining <= 0) {
      end += (Math.floor(Math.abs(remaining) / duration) + 1) * duration;
      try { localStorage.setItem(storageKey, String(end)); } catch (error) {}
      remaining = end - Date.now();
    }

    var seconds = Math.max(0, Math.ceil(remaining / 1000));
    var hours = Math.floor(seconds / 3600);
    var minutes = Math.floor((seconds % 3600) / 60);
    var secs = seconds % 60;
    output.textContent = pad(hours) + ' : ' + pad(minutes) + ' : ' + pad(secs);
  }

  updateCountdown();
  window.setInterval(updateCountdown, 1000);
})();
</script>
